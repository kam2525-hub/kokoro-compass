<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>こもれびの羅針盤 | 心がほっとする、生きる意味の見つけ方</title>
  <meta name="description" content="生きる意味に迷ったとき、大きな答えを探す代わりに、あなたの日常にある小さな光や温もりを思い出すための優しいガイド。">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Zen+Maru+Gothic:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- html2canvas for card download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#FAF7F2] text-[#4A443F] font-zen selection:bg-[#EADBC8] selection:text-[#4A443F] min-h-screen relative overflow-x-hidden flex flex-col justify-between">

  <!-- Background Ambient Lights -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="ambient-glow bg-[#FCE8D5] w-[450px] h-[450px] -top-24 -left-24 rounded-full blur-[100px] opacity-70 animate-float-slow"></div>
    <div class="ambient-glow bg-[#E4ECE3] w-[500px] h-[500px] top-1/2 -right-36 rounded-full blur-[110px] opacity-60 animate-float-medium"></div>
    <div class="ambient-glow bg-[#F7EFE4] w-[400px] h-[400px] -bottom-24 left-1/3 rounded-full blur-[90px] opacity-70 animate-float-slow"></div>
  </div>

  <!-- Header -->
  <header class="relative z-10 w-full max-w-3xl mx-auto px-6 py-6 flex items-center justify-between">
    <div class="flex items-center gap-2 cursor-pointer" onclick="app.resetToStart()">
      <div class="w-9 h-9 rounded-full bg-[#E8DDD1] flex items-center justify-center text-[#705E51] shadow-inner">
        <i data-lucide="compass" class="w-5 h-5"></i>
      </div>
      <div>
        <span class="text-sm font-semibold tracking-wider text-[#63554A] font-mincho block leading-tight">こもれびの羅針盤</span>
        <span class="text-[11px] text-[#9E8E81] tracking-widest block">KOMOREBI COMPASS</span>
      </div>
    </div>

    <!-- Sound & Ambient Audio Toggle -->
    <div class="flex items-center gap-2">
      <button id="soundToggleBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs bg-white/70 backdrop-blur-md border border-[#E5DACD] text-[#6E6053] hover:bg-white transition-all shadow-sm active:scale-95" title="優しい音と音楽を切り替え">
        <i data-lucide="volume-2" id="soundIcon" class="w-4 h-4 text-[#8C7A6B]"></i>
        <span id="soundText" class="text-xs">音: オン</span>
      </button>
      <button id="restartBtn" class="p-1.5 rounded-full text-xs bg-white/60 border border-[#E5DACD] text-[#8C7A6B] hover:bg-white hover:text-[#53463B] transition-all shadow-sm hidden" title="最初からやり直す" onclick="app.resetToStart()">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="relative z-10 w-full max-w-2xl mx-auto px-4 sm:px-6 py-4 flex-grow flex flex-col justify-center">

    <!-- Progress Indicator (Hidden on intro and result) -->
    <div id="progressContainer" class="mb-6 hidden transition-all duration-500">
      <div class="flex justify-between items-center text-xs text-[#9E8E81] mb-2 px-1">
        <span id="stepCategoryText" class="font-medium tracking-wide">心のたな卸し</span>
        <span id="stepCountText" class="tabular-nums font-semibold text-[#7D6B5D]">1 / 5</span>
      </div>
      <div class="w-full bg-[#E8E0D5] h-1.5 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-gradient-to-r from-[#D7BAA2] to-[#B3C9B2] h-full rounded-full transition-all duration-500 ease-out" style="width: 20%;"></div>
      </div>
    </div>

    <!-- Dynamic Screen Container -->
    <div id="screenContainer" class="bg-white/80 backdrop-blur-xl border border-white/70 rounded-3xl p-6 sm:p-10 shadow-[0_15px_40px_-15px_rgba(180,165,150,0.18)] transition-all duration-400 min-h-[460px] flex flex-col justify-between">
      <!-- Injected by JavaScript -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="relative z-10 w-full max-w-2xl mx-auto px-6 py-6 text-center text-xs text-[#9D8E82] leading-relaxed">
    <p>生きる意味は、どこかに隠れている宝物ではなく、今この瞬間に灯るあかりです。</p>
    <p class="mt-1 text-[11px] opacity-75">入力内容はブラウザ内でのみ処理され、外部には一切送信されません。</p>
  </footer>

  <!-- Script -->
  <script src="app.js"></script>
</body>
</html>
